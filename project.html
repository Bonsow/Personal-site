<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — Spencer Anderson</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Lenis -->
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.28/dist/lenis.css" />

    <!-- Compiled by Live Sass Compiler from scss/main.scss -->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- Close button: back to the projects list -->
    <div class="project-close-bar">
      <a href="projects.html" class="project-close" aria-label="Close project and go back to all projects">
        <span class="project-close__icon" aria-hidden="true"></span>
      </a>
    </div>

    <main class="page page--reading project" id="project">
      <header class="project__header">
        <h1 class="project__title" id="project-title">Loading…</h1>
        <p class="label project__date" id="project-date"></p>
      </header>

      <!-- Filled in from js/data/projects/<id>.json by js/project.js -->
      <div class="project__sections" id="project-sections"></div>
    </main>

    <script src="https://unpkg.com/lenis@1.3.28/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/project-data.js"></script>
    <script src="js/project-render.js"></script>
    <script src="js/project.js"></script>
  </body>
</html>
